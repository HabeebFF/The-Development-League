# Production on one server (e.g. the free Oracle Cloud VM): the same services as local
# development, plus Caddy in front for free HTTPS. Secrets come from ../.env, which
# infra/oracle/setup.sh creates. Start it from the repo root:
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tdl
      POSTGRES_USER: tdl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tdl"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    build: ../backend
    restart: unless-stopped
    # Long timeout: 50 MB+ logs upload straight through Django when S3 is off.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 600"
    env_file: ../.env
    environment: &django
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://tdl:${POSTGRES_PASSWORD}@db:5432/tdl
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
    volumes: [media:/data/media, static:/app/staticfiles]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ../backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 2
    env_file: ../.env
    environment: *django
    volumes: [media:/data/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    build:
      context: ../frontend
      args: { API_URL: "http://web:8000" }
    restart: unless-stopped
    depends_on: [web]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
    depends_on: [web, frontend]

volumes:
  pgdata:
  media:
  static:
  caddy_data:
